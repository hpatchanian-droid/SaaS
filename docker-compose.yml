version: "3.9"

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://lvlops:lvlops@db:5432/lvlops?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lvlops
      POSTGRES_PASSWORD: lvlops
      POSTGRES_DB: lvlops
    ports:
      - "5432:5432"
    volumes:
      - lvlops-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lvlops"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  lvlops-db:
